<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混合實境急救車 3D 視覺化模擬平台</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google model-viewer 3D 元件 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    model-viewer {
      width: 100%;
      height: 260px; /* 手機版預設高度 */
      background-color: #f8fafc;
      --poster-color: transparent;
    }
    @media (min-width: 1024px) {
      model-viewer {
        height: 440px; /* 電腦版高度 */
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 antialiased relative">

  <!-- 綠色 Header 標題列（設定 sticky top-0 z-50 浮動固定在螢幕最頂端） -->
  <header class="bg-emerald-800 text-white py-4 shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 flex flex-col gap-0.5">
      <h1 class="text-xl sm:text-2xl font-bold tracking-wide">
        混合實境急救車 3D 視覺化模擬平台
      </h1>
      <p class="text-xs text-emerald-200">1:1 混合實境急救車配置、藥品與用物圖鑑與擬真學習系統</p>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-7xl mx-auto px-6 py-6">

    <!-- 主容器：手機版為 single column（透過 order 調整順序），電腦版為 12 欄雙欄 -->
    <div class="flex flex-col lg:grid lg:grid-cols-12 gap-6 items-start">
      
      <!-- 3D 模型展示區（手機版 order-1 置頂，sticky top-[73px] 貼在抬頭下方；電腦版 order-2 靠右置頂） -->
      <section class="w-full order-1 lg:order-2 lg:col-span-5 sticky top-[73px] lg:top-24 z-40 bg-slate-100 lg:bg-transparent pb-3 lg:pb-0">
        <div class="bg-white p-4 lg:p-5 rounded-2xl shadow-md lg:shadow-sm border border-slate-200">
          
          <!-- 模型標題與說明 -->
          <div class="mb-2 lg:mb-3">
            <h2 id="currentDrugTitle" class="text-base lg:text-lg font-bold text-slate-900 truncate">
              Aspirin (阿司匹靈) - 3D 模型
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">按住滑鼠左鍵（或單指滑動）可 360 度旋轉模型。</p>
          </div>

          <!-- 3D 模型展示元件 -->
          <div class="relative rounded-xl overflow-hidden border border-slate-100 mb-3 lg:mb-4 bg-slate-50">
            <model-viewer 
              id="drugViewer" 
              camera-controls 
              auto-rotate 
              shadow-intensity="1"
              alt="藥品 3D 模型"
            >
            </model-viewer>

            <div id="noModelNotice" class="hidden absolute inset-0 bg-slate-50 flex flex-col items-center justify-center p-6 text-center text-slate-400">
              <p class="text-xs font-medium">此藥品項目暫無 3D 模型檔案</p>
            </div>
          </div>

          <!-- 按鈕區塊 -->
          <div class="grid grid-cols-2 gap-2 lg:gap-3">
            <button type="button" onclick="resetCamera()" class="w-full py-1.5 lg:py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition">
              重設視角
            </button>
            <button type="button" onclick="toggleAutoRotate()" class="w-full py-1.5 lg:py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition">
              切換自動旋轉
            </button>
          </div>

        </div>
      </section>

      <!-- 左側欄位：包含搜尋列 + 藥品卡片清單（手機版 order-2 排在模型下方，電腦版 order-1 佔 7 欄） -->
      <div class="w-full order-2 lg:order-1 lg:col-span-7 space-y-4">
        
        <!-- 搜尋與篩選列（精確對齊下方藥品卡片欄位） -->
        <section class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-3 items-center">
          <!-- 搜尋框 -->
          <div class="relative w-full flex-1">
            <input 
              type="text" 
              id="searchInput" 
              placeholder="搜尋藥品英文/中文名、商品名、作用..." 
              class="w-full pl-4 pr-4 py-2 text-sm text-slate-600 bg-transparent focus:outline-none"
            />
          </div>

          <!-- 分隔線 -->
          <div class="hidden sm:block h-6 w-[1px] bg-slate-200"></div>

          <!-- 類別下拉選單 -->
          <div class="w-full flex-1">
            <select 
              id="categorySelect" 
              class="w-full px-3 py-2 text-sm border-0 focus:outline-none focus:ring-1 focus:ring-emerald-600 bg-white text-slate-700 cursor-pointer"
            >
              <option value="all">所有類別</option>
              <option value="bridge">檯面橋架</option>
              <option value="countertop">檯面用品</option>
              <option value="drawer1">第一層抽屜</option>
              <option value="drawer2">第二層抽屜</option>
              <option value="drawer3">第三層抽屜</option>
              <option value="drawer4">第四層抽屜</option>
              <option value="side">側邊用物</option>
              <option value="back">背面</option>
            </select>
          </div>
        </section>

        <!-- 藥品卡片動態渲染容器 -->
        <div class="space-y-4" id="drugListContainer">
          <!-- 卡片會由 JavaScript 動態生成 -->
        </div>

      </div>

    </div>
  </main>

  <!-- 回到最上面按鈕 -->
  <button 
    type="button"
    id="scrollToTopBtn" 
    onclick="scrollToTop()"
    class="fixed bottom-6 right-6 transition-all duration-300 bg-emerald-700 hover:bg-emerald-800 text-white p-3.5 rounded-full shadow-lg hover:shadow-xl focus:outline-none z-50 flex items-center justify-center opacity-0 pointer-events-none"
    title="回到頂端"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"></path>
    </svg>
  </button>

  <!-- JavaScript 邏輯 -->
  <script>
    let drugsData = [];

    // 各抽屜對應的內文補充說明
    const drawerSubtitles = {
      'drawer1': '急救車必備藥品',
      'drawer2': '靜脈輸液用物',
      'drawer3': '插管用物',
      'drawer4': '其它輔助用物'
    };

    // 低彩度相近色主題
    const categoryThemeMap = {
      'bridge': {
        borderClass: 'border-emerald-600',
        categoryBg: 'bg-emerald-50 text-emerald-800 border border-emerald-200'
      },
      'countertop': {
        borderClass: 'border-teal-600',
        categoryBg: 'bg-teal-50 text-teal-800 border border-teal-200'
      },
      'drawer1': {
        borderClass: 'border-cyan-600',
        categoryBg: 'bg-cyan-50 text-cyan-800 border border-cyan-200'
      },
      'drawer2': {
        borderClass: 'border-sky-600',
        categoryBg: 'bg-sky-50 text-sky-800 border border-sky-200'
      },
      'drawer3': {
        borderClass: 'border-blue-600',
        categoryBg: 'bg-blue-50 text-blue-800 border border-blue-200'
      },
      'drawer4': {
        borderClass: 'border-indigo-400',
        categoryBg: 'bg-indigo-50 text-indigo-800 border border-indigo-200'
      },
      'side': {
        borderClass: 'border-slate-500',
        categoryBg: 'bg-slate-100 text-slate-700 border border-slate-300'
      },
      'back': {
        borderClass: 'border-zinc-500',
        categoryBg: 'bg-zinc-100 text-zinc-700 border border-zinc-300'
      }
    };

    // 載入 JSON 資料
    function loadDrugsData() {
      const drugListContainer = document.getElementById('drugListContainer');
      try {
        drugListContainer.innerHTML = '<div class="bg-white p-8 text-center text-slate-400 rounded-xl border border-slate-200"><p class="animate-pulse">正在載入藥品資料庫...</p></div>';

        fetch('./drugs.json')
          .then(response => {
            if (!response.ok) throw new Error('讀取 drugs.json 失敗');
            return response.json();
          })
          .then(data => {
            drugsData = data;
            renderDrugs(drugsData);
            if (drugsData.length > 0) {
              selectDrug(drugsData[0].id);
            }
          })
          .catch(error => {
            console.error('載入失敗:', error);
            drugListContainer.innerHTML = '<div class="bg-red-50 p-6 text-center text-red-600 rounded-xl border border-red-200">無法載入 drugs.json，請確認檔案位置與格式。</div>';
          });
      } catch (e) {
        console.error('讀取異常:', e);
      }
    }

    // 格式化藥品名稱
    function formatDrugName(drug) {
      const en = drug.nameEn ? drug.nameEn.trim() : '';
      const zh = drug.nameZh ? drug.nameZh.trim() : '';

      if (en && zh) return `${en} <span class="font-bold text-slate-700">(${zh})</span>`;
      if (en) return en;
      if (zh) return zh;
      return '未命名藥品';
    }

    // 渲染藥品卡片
    function renderDrugs(list) {
      const drugListContainer = document.getElementById('drugListContainer');
      if (!drugListContainer) return;

      if (list.length === 0) {
        drugListContainer.innerHTML = '<div class="bg-white p-8 text-center text-slate-400 rounded-xl border border-slate-200">找不到符合條件的藥品。</div>';
        return;
      }

      drugListContainer.innerHTML = list.map(drug => {
        const subNote = drawerSubtitles[drug.category] || drug.subtitle || '';

        const theme = categoryThemeMap[drug.category] || {
          borderClass: 'border-emerald-600',
          categoryBg: 'bg-emerald-50 text-emerald-800 border border-emerald-200'
        };

        const borderClass = drug.borderClass || theme.borderClass;
        const categoryBg = drug.categoryBg || theme.categoryBg;

        const quantityHtml = drug.quantity ? 
          `<span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md border border-slate-200">數量：${drug.quantity}</span>` : '';

        const subNoteHtml = subNote ? 
          `<p class="text-sm text-slate-500 font-normal mb-1">${subNote}</p>` : '';

        const dosageHtml = (drug.dosage || drug.dosageForm) ? 
          `<div class="text-sm font-semibold text-slate-700 mb-4">劑量：${drug.dosage || ''} ${drug.dosageForm ? `(${drug.dosageForm})` : ''}</div>` : '<div class="mb-4"></div>';

        const brandHtml = drug.brandName ? `<p><strong class="font-bold text-slate-900">商品名：</strong>${drug.brandName}</p>` : '';
        const mechHtml = drug.mechanism ? `<p><strong class="font-bold text-slate-900">藥理機轉：</strong>${drug.mechanism}</p>` : '';
        const indHtml = drug.indications ? `<p><strong class="font-bold text-slate-900">臨床適應症：</strong>${drug.indications}</p>` : '';

        let nursingHtml = '';
        if (drug.nursingNotes && drug.nursingNotes.length > 0) {
          let listItems = '';
          if (Array.isArray(drug.nursingNotes)) {
            listItems = drug.nursingNotes.map(note => `<li>${note}</li>`).join('');
          } else {
            listItems = `<li>${drug.nursingNotes}</li>`;
          }
          nursingHtml = `<div class="mt-2 pt-2 border-t border-slate-50"><p><strong class="font-bold text-slate-900">護理衛教注意事項：</strong></p><ul class="list-disc list-inside pl-1 text-xs text-slate-600 mt-1 space-y-1">${listItems}</ul></div>`;
        }

        return `
          <article onclick="selectDrug('${drug.id}')" class="bg-white p-6 rounded-2xl shadow-sm border-l-4 ${borderClass} hover:shadow-md transition cursor-pointer relative">
            <div class="flex justify-between items-center mb-3">
              <span class="inline-block px-2.5 py-0.5 ${categoryBg} text-xs font-semibold rounded-md">${drug.categoryLabel || drug.category}</span>
              ${quantityHtml}
            </div>
            ${subNoteHtml}
            <h3 class="text-xl font-bold text-slate-900 mb-1.5">${formatDrugName(drug)}</h3>
            ${dosageHtml}
            <div class="text-sm space-y-2 text-slate-700 border-t border-slate-100 pt-3">
              ${brandHtml}${mechHtml}${indHtml}${nursingHtml}
            </div>
          </article>
        `;
      }).join('');
    }

    // 篩選 logic
    function filterDrugs() {
      const searchInput = document.getElementById('searchInput');
      const categorySelect = document.getElementById('categorySelect');
      if (!searchInput || !categorySelect) return;

      const keyword = searchInput.value.toLowerCase().trim();
      const selectedCategory = categorySelect.value;

      const filtered = drugsData.filter(drug => {
        const matchCategory = selectedCategory === 'all' || drug.category === selectedCategory;
        const matchKeyword = 
          (drug.nameEn && drug.nameEn.toLowerCase().includes(keyword)) ||
          (drug.nameZh && drug.nameZh.toLowerCase().includes(keyword)) ||
          (drug.brandName && drug.brandName.toLowerCase().includes(keyword)) ||
          (drug.mechanism && drug.mechanism.toLowerCase().includes(keyword)) ||
          (drug.indications && drug.indications.toLowerCase().includes(keyword));

        return matchCategory && matchKeyword;
      });

      renderDrugs(filtered);
    }

    // 選擇藥品切換模型
    function selectDrug(drugId) {
      const title = document.getElementById('currentDrugTitle');
      const viewer = document.getElementById('drugViewer');
      const noModelNotice = document.getElementById('noModelNotice');

      const drug = drugsData.find(d => d.id === drugId);
      if (drug && title && viewer && noModelNotice) {
        const displayName = (drug.nameEn && drug.nameZh) 
          ? `${drug.nameEn} (${drug.nameZh})` 
          : (drug.nameEn || drug.nameZh || '未命名藥品');
          
        title.innerText = `${displayName} - 3D 模型`;

        if (drug.modelUrl && drug.modelUrl.trim() !== '') {
          noModelNotice.className = 'hidden absolute inset-0 bg-slate-50 flex flex-col items-center justify-center p-6 text-center text-slate-400';
          viewer.src = drug.modelUrl;
          viewer.cameraOrbit = 'auto auto auto';
          if (typeof viewer.jumpToGoal === 'function') {
            viewer.jumpToGoal();
          }
        } else {
          viewer.src = '';
          noModelNotice.className = 'absolute inset-0 bg-slate-50 flex flex-col items-center justify-center p-6 text-center text-slate-400';
        }
      }
    }

    function resetCamera() {
      const viewer = document.getElementById('drugViewer');
      if (viewer) {
        viewer.cameraOrbit = 'auto auto auto';
        viewer.cameraTarget = 'auto auto auto';
      }
    }

    function toggleAutoRotate() {
      const viewer = document.getElementById('drugViewer');
      if (viewer) {
        viewer.autoRotate = !viewer.autoRotate;
      }
    }

    // 回到頂端邏輯
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('scrollToTopBtn');
      if (!btn) return;

      const baseStyle = 'fixed bottom-6 right-6 transition-all duration-300 bg-emerald-700 hover:bg-emerald-800 text-white p-3.5 rounded-full shadow-lg hover:shadow-xl focus:outline-none z-50 flex items-center justify-center ';
      
      if (window.scrollY > 300) {
        btn.className = baseStyle + 'opacity-100';
      } else {
        btn.className = baseStyle + 'opacity-0 pointer-events-none';
      }
    });

    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    // 初始化事件繫結
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');
      const categorySelect = document.getElementById('categorySelect');

      if (searchInput) searchInput.addEventListener('input', filterDrugs);
      if (categorySelect) categorySelect.addEventListener('change', filterDrugs);

      loadDrugsData();
    });
  </script>
</body>
</html>
